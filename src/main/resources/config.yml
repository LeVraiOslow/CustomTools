# ════════════════════════════════════════════════════════════
#  CustomTools - configuration
#  Tout le texte utilise le format MiniMessage (<red>, <bold>, <gradient:...>)
#  Toute clé de "Réglages" peut être redéfinie PAR OUTIL (voir plus bas).
# ════════════════════════════════════════════════════════════

# ───────────── Réglages (valeurs par défaut de tous les outils) ─────────────
# Si true : accroupi, l'outil agit comme un outil normal (1 seul bloc)
sneak-disables: true
# Coût en durabilité par bloc cassé (le bloc d'origine compte aussi)
durability-per-block: 1
# Ligne de durabilité ajoutée au lore. Placeholders : <current> <max>
durability-lore: "<gray>Durabilité : <white><current><gray>/<white><max>"
# Unbreaking : chaque point de durabilité a 1/(niveau+1) chance d'être consommé
respect-unbreaking: true
# Avertissement en action bar quand la durabilité passe sous ce % (0 = désactivé)
low-durability-warning-percent: 10

# Houe
require-mature: true      # ne casse que les cultures mûres
replant: true             # replante après la récolte
consume-seeds: true       # replanter consomme une graine de l'inventaire (sinon : casse sans replanter)

# Hache
max-logs: 256             # nombre max de bûches cassées d'un coup
require-leaves: true      # exige des feuilles naturelles contre l'arbre

# Pioche de fonte
smelt-give-xp: true

# ───────────── Listes globales ─────────────
# Cultures gérées par la houe -> item consommé pour replanter (AIR = replantage gratuit)
crops:
  WHEAT: WHEAT_SEEDS
  CARROTS: CARROT
  POTATOES: POTATO
  BEETROOTS: BEETROOT_SEEDS
  NETHER_WART: NETHER_WART

# Blocs jamais cassés en zone par la pioche 3x3 (en plus des incassables et des conteneurs)
hammer-blacklist: [SPAWNER, TRIAL_SPAWNER, VAULT, REINFORCED_DEEPSLATE, END_PORTAL_FRAME]
# Items jamais fondus par la pioche de fonte
smelt-blacklist: []

# ───────────── Enchantements / réparation ─────────────
# Autorise des niveaux au-dessus du max vanilla dans la section "enchantments" des outils
ignore-level-limit: true
# Anvil : livres enchantés autorisés, réparation bloquée
anvil-allow-enchanted-books: true
block-repair:
  anvil: true         # pas de réparation (matériau ou fusion de 2 outils) à l'enclume
  grindstone: true    # pas de fusion de 2 outils à la meule
  crafting: true      # pas de réparation en table de craft
# Note : le Mending est désactivé sur les outils à durabilité custom.
# Réparation admin : /ctools repair

# ───────────── Sons (clés de sons vanilla, vide = aucun) ─────────────
sounds:
  tool-break: "entity.item.break"

# ───────────── Messages ─────────────
messages:
  prefix: "<dark_gray>[<gold>CustomTools<dark_gray>] <reset>"
  no-permission: "<red>Tu n'as pas la permission."
  usage: "<yellow>/ctools give <joueur> <outil> [durabilité] <gray>| <yellow>list <gray>| <yellow>repair <gray>| <yellow>reload"
  usage-give: "<red>Usage : /ctools give <joueur> <outil> [durabilité]"
  reloaded: "<green>Configuration rechargée."
  list: "<yellow>Outils disponibles : <white><tools>"
  unknown-subcommand: "<red>Sous-commande inconnue."
  unknown-player: "<red>Joueur introuvable."
  unknown-tool: "<red>Outil inconnu. Utilise /ctools list."
  invalid-durability: "<red>Durabilité invalide."
  given: "<green><tool> donné à <player>."
  received: "<green>Tu as reçu : <tool>"
  player-only: "<red>Commande réservée aux joueurs."
  hold-tool: "<red>Tiens un outil custom en main."
  repaired: "<green>Outil réparé."
  tool-broken: "<red>Ton outil <tool><red> s'est brisé !"
  low-durability: "<red>⚠ Durabilité faible : <current>/<max>"
  no-seed: "<yellow>Tu n'as pas de <seed> pour replanter."

# ───────────── Outils ─────────────
# features     : HAMMER (zone) | HARVEST (récolte+replante) | TREE_CHOPPER | SMELT  (combinables)
# material     : item de base (ignoré si nexo-id est valide)
# nexo-id      : id de l'item Nexo (texture custom). Vide = item vanilla
# name         : nom MiniMessage (ignoré pour un item Nexo : le nom vient de Nexo)
# lore         : lignes de lore (MiniMessage), affichées au-dessus de la ligne de durabilité
# enchantments : enchantements vanilla appliqués à la création (efficiency, unbreaking, fortune...)
# durability   : durabilité custom (0 = durabilité vanilla, non gérée par le plugin)
# radius       : 1 = 3x3, 2 = 5x5 ...
# Toute clé de "Réglages" (sneak-disables, max-logs, consume-seeds...) peut être ajoutée ici
# pour surcharger la valeur par défaut de cet outil uniquement.
tools:
  hammer_pickaxe:
    features: [HAMMER]
    material: DIAMOND_PICKAXE
    nexo-id: ""
    name: "<aqua><bold>Pioche 3x3"
    lore:
      - ""
      - "<gray>Casse une zone de <white>3x3 <gray>blocs."
      - "<dark_gray>Accroupi : casse 1 bloc."
    enchantments:
      efficiency: 5
      unbreaking: 3
    durability: 3000
    radius: 1

  replant_hoe:
    features: [HARVEST]
    material: DIAMOND_HOE
    nexo-id: ""
    name: "<green><bold>Houe 3x3"
    lore:
      - ""
      - "<gray>Récolte et replante en <white>3x3<gray>."
      - "<dark_gray>Consomme des graines."
    enchantments:
      fortune: 3
      unbreaking: 3
    durability: 2000
    radius: 1

  lumber_axe:
    features: [TREE_CHOPPER]
    material: DIAMOND_AXE
    nexo-id: ""
    name: "<gold><bold>Hache du bûcheron"
    lore:
      - ""
      - "<gray>Abat l'arbre <white>entier <gray>d'un coup."
    enchantments:
      efficiency: 5
      unbreaking: 3
    durability: 2500

  smelter_pickaxe:
    features: [SMELT]
    material: DIAMOND_PICKAXE
    nexo-id: ""
    name: "<red><bold>Pioche de fonte"
    lore:
      - ""
      - "<gray>Fait <white>cuire <gray>les blocs minés."
    enchantments:
      efficiency: 5
      fortune: 3
    durability: 2500
