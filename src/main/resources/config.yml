# ════════════════════════════════════════════════════════════
#  CustomTools - configuration
#
#  COULEURS (name, lore, messages, durability-lore) - tous les formats se mélangent :
#    - codes Minecraft : &a &c &l (gras) &o (italique) &n &m &k &r
#    - couleurs HTML   : &#RRGGBB  (ex: &#00E5FF)   ou   <#RRGGBB>
#    - MiniMessage     : <red> <bold> <gradient:#ff0000:#0000ff>texte</gradient>
#
#  Toute clé de "Réglages" peut être redéfinie PAR OUTIL (voir section tools).
# ════════════════════════════════════════════════════════════

# ───────────── Réglages (valeurs par défaut de tous les outils) ─────────────
# Si true : accroupi, l'outil agit comme un outil normal (1 seul bloc)
sneak-disables: false
# Cache les infos "When in Main Hand / Attack Damage / Attack Speed / Mining Efficiency"
hide-attributes: true
# Coût en durabilité par bloc cassé (le bloc d'origine compte aussi)
durability-per-block: 1
# Ligne de durabilité ajoutée au lore. Placeholders : <current> <max>
durability-lore: "&7Durabilité : &f<current>&7/&f<max>"
# Unbreaking : chaque point de durabilité a 1/(niveau+1) chance d'être consommé
respect-unbreaking: true
# Avertissement en action bar quand la durabilité passe sous ce % (0 = désactivé)
low-durability-warning-percent: 10

# Houe
require-mature: true      # ne casse que les cultures mûres
replant: true             # replante après la récolte
consume-seeds: true       # replanter consomme une graine de l'inventaire (sinon : casse sans replanter)

# Hache
max-logs: 256             # nombre max de bûches cassées d'un coup
require-leaves: true      # exige des feuilles naturelles contre l'arbre

# Pioche de fonte
smelt-give-xp: true

# Pioche à spawners
spawner-durability-cost: 10   # durabilité consommée par spawner cassé
spawner-drop-xp: false        # false = pas d'XP quand on récupère le spawner
# Nom / lore de l'item spawner récupéré. Placeholder : <mob>
spawner-item-name: "&#B000FFSpawner &7(&f<mob>&7)"
spawner-item-lore:
  - "&7Type : &f<mob>"

# ───────────── Listes globales ─────────────
# Cultures gérées par la houe -> item consommé pour replanter (AIR = replantage gratuit)
crops:
  WHEAT: WHEAT_SEEDS
  CARROTS: CARROT
  POTATOES: POTATO
  BEETROOTS: BEETROOT_SEEDS
  NETHER_WART: NETHER_WART

# Blocs jamais cassés en zone par le marteau 3x3 (en plus des incassables et des conteneurs)
hammer-blacklist: [SPAWNER, TRIAL_SPAWNER, VAULT, REINFORCED_DEEPSLATE, END_PORTAL_FRAME]
# Items jamais fondus par la pioche de fonte
smelt-blacklist: []

# ───────────── Enchantements / réparation ─────────────
# Autorise des niveaux au-dessus du max vanilla dans la section "enchantments" des outils
ignore-level-limit: true
# Anvil : livres enchantés autorisés, réparation bloquée
anvil-allow-enchanted-books: true
block-repair:
  anvil: true         # pas de réparation (matériau ou fusion de 2 outils) à l'enclume
  grindstone: true    # pas de fusion de 2 outils à la meule
  crafting: true      # pas de réparation en table de craft
# Note : le Mending est désactivé sur les outils à durabilité custom.
# Réparation admin : /ctools repair

# ───────────── Sons (clés de sons vanilla, vide = aucun) ─────────────
sounds:
  tool-break: "entity.item.break"

# ───────────── Messages ─────────────
messages:
  prefix: "&8[&6CustomTools&8] &r"
  no-permission: "&cTu n'as pas la permission."
  usage: "&e/ctools give <joueur> <outil> [durabilité] &7| &elist &7| &erepair &7| &ereload"
  usage-give: "&cUsage : /ctools give <joueur> <outil> [durabilité]"
  reloaded: "&aConfiguration rechargée."
  list: "&eOutils disponibles : &f<tools>"
  unknown-subcommand: "&cSous-commande inconnue."
  unknown-player: "&cJoueur introuvable."
  unknown-tool: "&cOutil inconnu. Utilise /ctools list."
  invalid-durability: "&cDurabilité invalide."
  given: "&a<tool> &adonné à <player>."
  received: "&aTu as reçu : <tool>"
  player-only: "&cCommande réservée aux joueurs."
  hold-tool: "&cTiens un outil custom en main."
  repaired: "&aOutil réparé."
  tool-broken: "&cTon outil <tool> &cs'est brisé !"
  low-durability: "&c⚠ Durabilité faible : <current>/<max>"
  no-seed: "&eTu n'as pas de <seed> pour replanter."

# ───────────── Outils ─────────────
# features     : HAMMER (zone) | HARVEST (récolte+replante) | TREE_CHOPPER | SMELT | SPAWNER  (combinables)
# material     : item de base utilisé si nexo-id est vide ou introuvable
# nexo-id      : id de l'item Nexo (texture custom). Vide = item vanilla
# name         : nom (couleurs &, &#hex, MiniMessage). Vide = garde le nom de l'item Nexo
# lore         : lignes de lore, affichées au-dessus de la ligne de durabilité
# enchantments : enchantements vanilla appliqués à la création (efficiency, unbreaking, fortune...)
# durability   : durabilité custom (0 = durabilité vanilla, non gérée par le plugin)
# radius       : 1 = 3x3, 2 = 5x5 ...
# Toute clé de "Réglages" (sneak-disables, max-logs, consume-seeds...) peut être ajoutée ici
# pour surcharger la valeur par défaut de cet outil uniquement.
tools:
  hammer_pickaxe:
    features: [HAMMER]
    material: DIAMOND_PICKAXE
    nexo-id: "hammer_mythique"
    name: "&#00E5FF&lMarteau"
    lore:
      - ""
      - "&7Casse une zone de &f3x3 &7blocs."
    enchantments:
      efficiency: 5
      unbreaking: 3
    durability: 3000
    radius: 1

  replant_hoe:
    features: [HARVEST]
    material: DIAMOND_HOE
    nexo-id: "houe_mythique"
    name: "&#7CFF4F&lHoue 3x3"
    lore:
      - ""
      - "&7Récolte et replante en &f3x3&7."
      - "&8Consomme des graines."
    enchantments:
      fortune: 3
      unbreaking: 3
    durability: 2000
    radius: 1

  lumber_axe:
    features: [TREE_CHOPPER]
    material: DIAMOND_AXE
    nexo-id: "axe_mythique"
    name: "&#FFB300&lHache One Shot"
    lore:
      - ""
      - "&7Abat l'arbre &fentier &7d'un seul coup."
    enchantments:
      efficiency: 5
      unbreaking: 3
    durability: 2500

  smelter_pickaxe:
    features: [SMELT]
    material: DIAMOND_PICKAXE
    nexo-id: "pickaxe_mythique"
    name: "&#FF4D2E&lPioche AutoSmelt"
    lore:
      - ""
      - "&7Fait &fcuire &7les blocs minés."
    enchantments:
      efficiency: 5
      fortune: 3
    durability: 2500

  spawner_pickaxe:
    features: [SPAWNER]
    material: NETHERITE_PICKAXE
    nexo-id: ""            # mets ici l'id Nexo de ta texture quand tu l'auras
    name: "&#B000FF&lPioche à Spawners"
    lore:
      - ""
      - "&7Permet de &fcasser les spawners &7et de"
      - "&7les récupérer avec leur mob."
    enchantments:
      efficiency: 5
      unbreaking: 3
    durability: 500
